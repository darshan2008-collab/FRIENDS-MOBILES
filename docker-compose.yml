version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: friends_mobile_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-friends_mobile}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: friends_mobile_backend
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/friends_mobile}
      NODE_ENV: ${NODE_ENV:-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-xunitary@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-cymeyaijcvbofggd}
      FROM_EMAIL: ${FROM_EMAIL:-xunitary@gmail.com}
      GMAIL_USER: ${GMAIL_USER:-xunitary@gmail.com}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-cymeyaijcvbofggd}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://friends-mobiles-rho.vercel.app}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET}
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-1}
    volumes:
      - backend_data:/app/data
      - backend_images:/app/public/images
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friends_mobile_frontend
    ports:
      - "10026:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: "0.0.0.0"
      PORT: ${FRONTEND_PORT:-3000}
      VITE_BACKEND_URL: "http://backend:5000"
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
  backend_images:
